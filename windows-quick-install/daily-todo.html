<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily To-Do</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20512%20512%22%20width=%22512%22%20height=%22512%22%3E%3Crect%20width=%22512%22%20height=%22512%22%20rx=%22112%22%20fill=%22%230E7466%22/%3E%3Cg%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M104%20170l26%2026%2050-56M104%20256l26%2026%2050-56%22%20stroke-width=%2226%22/%3E%3Ccircle%20cx=%22142%22%20cy=%22342%22%20r=%2230%22%20stroke-width=%2222%22%20opacity=%22.7%22/%3E%3Cpath%20d=%22M228%20170h162M228%20256h162%22%20stroke-width=%2228%22/%3E%3Cpath%20d=%22M228%20342h112%22%20stroke-width=%2228%22%20opacity=%22.55%22/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#e9eef3; --surface:#ffffff; --ink:#14202c; --muted:#5d6b7a; --line:#d3dbe4;
  --accent:#0e7466; --accent-ink:#ffffff; --hi:#c2410c; --md:#a16207; --lo:#2563a8;
  --track:#cfd8e1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1720; --surface:#17222e; --ink:#e8eef4; --muted:#93a3b4; --line:#27384a;
    --accent:#3cc4ae; --accent-ink:#06211c; --hi:#fb923c; --md:#facc15; --lo:#7ab4f0; --track:#27384a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1720; --surface:#17222e; --ink:#e8eef4; --muted:#93a3b4; --line:#27384a;
  --accent:#3cc4ae; --accent-ink:#06211c; --hi:#fb923c; --md:#facc15; --lo:#7ab4f0; --track:#27384a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nav .sp{flex:1}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:36px}
.chip:hover{border-color:var(--accent)}
.date{margin:12px 0 4px;font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;letter-spacing:-.03em}
.sub{color:var(--muted);margin:0 0 20px}

.progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.progress .row{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600}
.bar{height:12px;background:var(--track);border-radius:999px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .35s ease}

.add{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.add input[type=text]{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.add select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px}
.add .go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}

.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 4px;margin-right:10px;color:var(--muted);font-weight:600}
.filters button[aria-pressed=true]{color:var(--ink);border-color:var(--accent)}

ul{list-style:none;margin:0;padding:0}
li.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:10px;padding:10px 12px;margin-bottom:8px}
li.task.p-high{border-left-color:var(--hi)}
li.task.p-med{border-left-color:var(--md)}
li.task.p-low{border-left-color:var(--lo)}
li.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
li.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;text-align:left;padding:2px 0}
li.task.done .txt{text-decoration:line-through;color:var(--muted)}
li.task .del{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 8px;border-radius:8px}
li.task .del:hover{color:var(--hi)}
li.task .edit{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:6px 8px}

.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 2px}
.foot button:hover{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;background:none;border:0;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.hist-only{display:none}
.hist .hist-only{display:block}
.hist .day-only{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat span{color:var(--muted);font-size:.8rem}
.dh{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);margin:14px 0 6px;padding:4px 0;font-weight:700;color:var(--muted)}
.dh:hover{color:var(--accent)}
.hrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:10px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.hrow.p-high{border-left-color:var(--hi)}
.hrow.p-med{border-left-color:var(--md)}
.htxt{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.hdone{text-decoration:line-through;color:var(--muted)}
.badge{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.badge.done{color:var(--accent);border-color:var(--accent)}
.badge.removed{color:var(--hi);border-color:var(--hi)}
.mini{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.mini:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="group" aria-label="View"><button id="tabDay" aria-pressed="true">Tasks</button><button id="tabHist" aria-pressed="false">History</button></div>
  <div class="nav day-only">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="36" height="36" aria-hidden="true" style="flex:none"><rect width="512" height="512" rx="112" fill="#0E7466"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M104 170l26 26 50-56M104 256l26 26 50-56" stroke-width="26"/><circle cx="142" cy="342" r="30" stroke-width="22" opacity=".7"/><path d="M228 170h162M228 256h162" stroke-width="28"/><path d="M228 342h112" stroke-width="28" opacity=".55"/></g></svg>
    <button class="chip" id="prev" aria-label="Previous day">‹ Prev</button>
    <button class="chip" id="today">Today</button>
    <button class="chip" id="next" aria-label="Next day">Next ›</button>
    <span class="sp"></span>
    <input class="chip" type="date" id="pick" aria-label="Jump to date">
  </div>
  <h1 class="date day-only" id="dateTitle"></h1>
  <p class="sub day-only" id="dateSub"></p>

  <div class="day-only">
  <div class="progress">
    <div class="row"><span id="pText">0 of 0 done</span><span id="pPct">0%</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div class="fill" id="fill"></div></div>
  </div>

  <div class="add">
    <input type="text" id="newText" placeholder="Add a task for this day" maxlength="200" aria-label="New task">
    <select id="newPri" aria-label="Priority">
      <option value="high">High</option>
      <option value="med" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <button class="go" id="addBtn">Add task</button>
  </div>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="open" aria-pressed="false">To do</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <button id="carry">Move unfinished tasks from yesterday</button>
    <button id="clearDone">Clear completed</button>
  </div>
  </div>
  <div class="hist-only" id="viewHist">
    <div class="stats" id="stats"></div>
    <div class="add">
      <input type="text" id="q" placeholder="Search all tasks" aria-label="Search all tasks">
      <select id="hf" aria-label="Filter history">
        <option value="all">All</option>
        <option value="done">Done</option>
        <option value="open">Open</option>
        <option value="removed">Removed</option>
      </select>
    </div>
    <div id="histList"></div>
  </div>
  <p class="sub" style="margin:14px 0 0;font-size:.8rem">Daily To-Do v1.2</p>
</div>

<script>
(function(){
  var KEY="daily-todo-v1";
  var state={tasks:{}};
  try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.tasks) state=p;}}catch(e){}
  var db=null, userId=null, queue={};
  function setStatus(t){var el=document.getElementById("sync");if(el)el.textContent=t;}
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function writeDay(day){
    if(!db||!userId)return;
    var body={tasks:state.tasks[day]||[]};
    queue[day]=(queue[day]||Promise.resolve()).then(function(){
      return db.collection("data/users/"+userId).doc("d-"+day).set(body);
    }).then(function(){setStatus("Saved to your account");})
      .catch(function(){setStatus("Couldn’t save to your account. Your tasks are kept on this device.");});
  }
  function save(day){saveLocal();writeDay(day||cur);}

  function fmt(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;}
  function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
  function shift(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d);}
  var todayStr=fmt(new Date());
  var cur=todayStr, filter="all", editing=null;
  var $=function(id){return document.getElementById(id);};

  function tasks(){return state.tasks[cur]||(state.tasks[cur]=[]);}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  function render(){
    var d=parse(cur);
    $("dateTitle").textContent=d.toLocaleDateString(undefined,{weekday:"long"});
    var rel=cur===todayStr?"Today · ":cur===shift(todayStr,-1)?"Yesterday · ":cur===shift(todayStr,1)?"Tomorrow · ":"";
    $("dateSub").textContent=rel.replace(" · ",", ")+d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
    $("pick").value=cur;

    var all=tasks().filter(function(t){return !t.hidden;}), done=all.filter(function(t){return t.done;}).length;
    var pct=all.length?Math.round(done/all.length*100):0;
    $("pText").textContent=done+" of "+all.length+" done";
    $("pPct").textContent=pct+"%";
    $("fill").style.width=pct+"%";
    $("bar").setAttribute("aria-valuenow",pct);

    var order={high:0,med:1,low:2};
    var shown=all.filter(function(t){return filter==="all"||(filter==="done"?t.done:!t.done);})
      .sort(function(a,b){return (a.done-b.done)||(order[a.pri]-order[b.pri]);});

    var ul=$("list"); ul.innerHTML="";
    if(!shown.length){
      var e=document.createElement("div"); e.className="empty";
      e.textContent=all.length?"Nothing here with this filter.":"No tasks yet. Add your first task above.";
      ul.appendChild(e);
    }
    shown.forEach(function(t){
      var li=document.createElement("li"); li.className="task p-"+t.pri+(t.done?" done":"");
      var cb=document.createElement("input"); cb.type="checkbox"; cb.checked=t.done; cb.setAttribute("aria-label","Mark done: "+t.text);
      cb.onchange=function(){t.done=cb.checked;t.doneAt=cb.checked?Date.now():null;save();render();};
      li.appendChild(cb);
      if(editing===t.id){
        var inp=document.createElement("input"); inp.className="edit"; inp.value=t.text; inp.maxLength=200;
        var commit=function(){var v=inp.value.trim(); if(v)t.text=v; editing=null; save(); render();};
        inp.onkeydown=function(ev){if(ev.key==="Enter")commit(); if(ev.key==="Escape"){editing=null;render();}};
        inp.onblur=commit;
        li.appendChild(inp);
        setTimeout(function(){inp.focus();inp.select();},0);
      }else{
        var b=document.createElement("button"); b.className="txt"; b.textContent=t.text; b.title="Edit task";
        b.onclick=function(){editing=t.id;render();};
        li.appendChild(b);
      }
      var del=document.createElement("button"); del.className="del"; del.textContent="×"; del.setAttribute("aria-label","Delete task: "+t.text);
      del.onclick=function(){t.hidden="deleted";save();render();};
      li.appendChild(del);
      ul.appendChild(li);
    });

    var prevOpen=(state.tasks[shift(cur,-1)]||[]).filter(function(t){return !t.done&&!t.hidden;}).length;
    $("carry").style.display=prevOpen?"":"none";
    $("carry").textContent="Move "+prevOpen+" unfinished "+(prevOpen===1?"task":"tasks")+" from the day before";
    $("clearDone").style.display=done?"":"none";
    if(document.body.classList.contains("hist"))renderHist();
  }

  function add(){
    var v=$("newText").value.trim(); if(!v){$("newText").focus();return;}
    tasks().push({id:uid(),text:v,done:false,pri:$("newPri").value,created:Date.now()});
    $("newText").value=""; save(); render(); $("newText").focus();
  }
  $("addBtn").onclick=add;
  $("newText").onkeydown=function(e){if(e.key==="Enter")add();};
  $("prev").onclick=function(){cur=shift(cur,-1);editing=null;render();};
  $("next").onclick=function(){cur=shift(cur,1);editing=null;render();};
  $("today").onclick=function(){cur=todayStr;editing=null;render();};
  $("pick").onchange=function(e){if(e.target.value){cur=e.target.value;editing=null;render();}};
  $("clearDone").onclick=function(){tasks().forEach(function(t){if(t.done&&!t.hidden)t.hidden="cleared";});save();render();};
  $("carry").onclick=function(){
    var py=shift(cur,-1), src=state.tasks[py]||[];
    var moved=src.filter(function(t){return !t.done&&!t.hidden;});
    moved.forEach(function(t){tasks().push(t);});
    state.tasks[py]=src.filter(function(t){return moved.indexOf(t)<0;});
    save(py); save(cur); render();
  };
  document.querySelectorAll(".filters button").forEach(function(b){
    b.onclick=function(){
      filter=b.dataset.f;
      document.querySelectorAll(".filters button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});
      render();
    };
  });

  function status(t){return t.hidden?"removed":(t.done?"done":"open");}
  function renderHist(){
    var rows=[];
    Object.keys(state.tasks).forEach(function(d){(state.tasks[d]||[]).forEach(function(t){rows.push({d:d,t:t});});});
    var c={Total:rows.length,Done:0,Open:0,Removed:0};
    rows.forEach(function(r){var s=status(r.t);c[s==="done"?"Done":s==="open"?"Open":"Removed"]++;});
    var st=$("stats"); st.innerHTML="";
    Object.keys(c).forEach(function(k){var e=document.createElement("div");e.className="stat";var b=document.createElement("b");b.textContent=c[k];var sp=document.createElement("span");sp.textContent=k;e.appendChild(b);e.appendChild(sp);st.appendChild(e);});
    var q=$("q").value.trim().toLowerCase(), f=$("hf").value;
    var shown=rows.filter(function(r){return (f==="all"||status(r.t)===f)&&(!q||r.t.text.toLowerCase().indexOf(q)>=0);});
    shown.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0;});
    var box=$("histList"); box.innerHTML="";
    if(!shown.length){var em=document.createElement("div");em.className="empty";em.textContent=rows.length?"No tasks match.":"No tasks recorded yet.";box.appendChild(em);return;}
    var last="";
    shown.forEach(function(r){
      if(r.d!==last){
        last=r.d;
        var h=document.createElement("button");h.className="dh";h.title="Open this day";
        h.textContent=parse(r.d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
        h.onclick=function(){cur=r.d;setView(false);};
        box.appendChild(h);
      }
      var t=r.t,s=status(t),row=document.createElement("div");row.className="hrow p-"+t.pri;
      var tx=document.createElement("span");tx.className="htxt"+(s==="done"?" hdone":"");tx.textContent=t.text;row.appendChild(tx);
      var bd=document.createElement("span");bd.className="badge "+s;
      bd.textContent=s==="removed"?(t.hidden==="cleared"?"Cleared":"Deleted"):(s==="done"?"Done":"Open");row.appendChild(bd);
      if(t.hidden){var rs=document.createElement("button");rs.className="mini";rs.textContent="Restore";
        rs.onclick=function(){delete t.hidden;save(r.d);render();};row.appendChild(rs);}
      var fd=document.createElement("button");fd.className="mini";fd.textContent="Delete forever";
      fd.onclick=function(){
        if(fd.dataset.arm){state.tasks[r.d]=state.tasks[r.d].filter(function(x){return x!==t;});save(r.d);render();}
        else{fd.dataset.arm="1";fd.textContent="Click again to confirm";setTimeout(function(){fd.dataset.arm="";fd.textContent="Delete forever";},3000);}
      };
      row.appendChild(fd);
      box.appendChild(row);
    });
  }
  function setView(h){
    document.body.classList.toggle("hist",h);
    $("tabDay").setAttribute("aria-pressed",h?"false":"true");
    $("tabHist").setAttribute("aria-pressed",h?"true":"false");
    editing=null; render();
  }
  $("tabDay").onclick=function(){setView(false);};
  $("tabHist").onclick=function(){setView(true);};
  $("q").oninput=renderHist; $("hf").onchange=renderHist;
  render();

})();
</script>
</body>
</html>
