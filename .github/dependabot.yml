version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Major upgrades (for example Kotlin 2 or Android Gradle Plugin 9) need manual
  # migration work, so Dependabot only proposes minor and patch updates.
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    ignore:
      # Kotlin and the Compose compiler must be upgraded together by hand
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "androidx.compose.compiler*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
